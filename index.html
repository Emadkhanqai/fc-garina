document.addEventListener('DOMContentLoaded', async function() {

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      : '*';
    function trustedOrigin(e) {

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

c-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;sfxVolume&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 1, &quot;min&quot;: 0, &quot;max&quot;: 1, &quot;step&quot;: 0.1, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Sound&quot;}, &quot;confetti&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Celebration&quot;}}\">\nconst TEAMS = [\n  { id: 'eclipse', name: 'TEAM ECLIPSE', short: 'ECLIPSE', players: ['Emad', 'Haris'], logo: 'logos/eclipse.png', color: '#f0b429', tagline: \"SHADOWS DON'T LOSE\" },\n  { id: 'royals', name: 'TEAM ROYALS', short: 'ROYALS', players: ['Roshan', 'Ibtesam'], logo: 'logos/royals.png', color: '#3f8cff', tagline: 'BORN TO DOMINATE' },\n  { id: 'raptors', name: 'TEAM RAPTORS', short: 'RAPTORS', players: ['Rafay', 'Abdullah'], logo: 'logos/raptors.png', color: '#a259ff', tagline: 'FAST. FIERCE. FEARLESS.' },\n  { id: 'warriors', name: 'TEAM WARRIORS', short: 'WARRIORS', players: ['Sami', 'Danish'], logo: 'logos/warriors.png', color: '#ff4b4b', tagline: 'WE FIGHT. WE WIN.' },\n  { id: 'falcons', name: 'TEAM FALCONS', short: 'FALCONS', players: ['Ali', 'Abdur Rehman'], logo: 'logos/falcons.png', color: '#54e04a', tagline: 'AIM HIGH. FLY HIGHER.' }\n];\n// The golden boot poster is one fixed-ratio image with two live lines painted\n// on top of it. Everything on the plate — the plate itself and the type — is\n// sized off this one expression so the lettering never drifts off its slot,\n// whatever the screen. Keep it in step with the poster's real pixel ratio.\nconst POSTER_RATIO = 1122 / 1402;\nconst POSTER_W = 'min(100vw - 24px,(100dvh - 24px)*' + POSTER_RATIO.toFixed(5) + ')';\nconst DEFAULT_PICKS = ['ARGENTINA', 'BARCELONA', 'BAYERN', 'ENGLAND', 'FRANCE', 'MANCHESTER CITY', 'PSG', 'REAL MADRID', 'SPAIN'];\nconst KEY = 'fc26_arena_v1';\n// The roll of honour lives in its own key: resetting the tournament clears\n// the board, and the record of who won it must not go with it.\nconst HALLKEY = 'fc26_arena_hall_v1';\nconst hallStore = {\n  get() { try { const v = JSON.parse(localStorage.getItem(HALLKEY)); return Array.isArray(v) ? v : []; } catch (e) { return []; } },\n  set(v) { try { localStorage.setItem(HALLKEY, JSON.stringify(v)); } catch (e) {} }\n};\nconst store = {\n  get() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } },\n  set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} },\n  del() { try { localStorage.removeItem(KEY); } catch (e) {} }\n};\nfunction glow(hex, a) {\n  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);\n  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';\n}\nfunction dim(hex, f) {\n  const c = [1, 3, 5].map(i => Math.max(0, Math.min(255, Math.round(parseInt(hex.slice(i, i + 2), 16) * f))));\n  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');\n}\nconst SFX = {\n  ctx: null, on: true, vol: 1,\n  ac() {\n    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }\n    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();\n    return this.ctx;\n  },\n  tone(f, d, type, v, when) {\n    const c = this.ac(); if (!c || !this.on) return;\n    const t = c.currentTime + (when || 0);\n    const o = c.createOscillator(), g = c.createGain();\n    o.type = type || 'square'; o.frequency.setValueAtTime(f, t);\n    o.connect(g); g.connect(c.destination);\n    const vv = (v || 0.12) * this.vol;\n    g.gain.setValueAtTime(0.0001, t);\n    g.gain.exponentialRampToValueAtTime(Math.max(vv, 0.0002), t + 0.012);\n    g.gain.exponentialRampToValueAtTime(0.0001, t + d);\n    o.start(t); o.stop(t + d + 0.05);\n  },\n  tick() { this.tone(1500, 0.045, 'square', 0.05); },\n  // The phone is in the operator's hand through the draw, so the wheel is\n  // felt as well as heard. iOS ignores this; Android does not.\n  buzz(pattern) { try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {} },\n  click() { this.tone(750, 0.05, 'triangle', 0.08); },\n  sweep(f, d, type, v, when) {\n    const c = this.ac(); if (!c || !this.on) return;\n    const t = c.currentTime + (when || 0);\n    const o = c.createOscillator(), g = c.createGain();\n    o.type = type || 'sawtooth';\n    o.frequency.setValueAtTime(f[0], t);\n    o.frequency.exponentialRampToValueAtTime(f[1], t + d);\n    o.connect(g); g.connect(c.destination);\n    const vv = (v || 0.14) * this.vol;\n    g.gain.setValueAtTime(0.0001, t);\n    g.gain.exponentialRampToValueAtTime(Math.max(vv, 0.0002), t + d * 0.55);\n    g.gain.exponentialRampToValueAtTime(0.0001, t + d);\n    o.start(t); o.stop(t + d + 0.05);\n  },\n  showdown() {\n    this.sweep([140, 780], 0.38, 'sawtooth', 0.16);\n    this.sweep([90, 260], 0.4, 'sine', 0.22);\n    this.tone(1320, 0.14, 'square', 0.09, 0.36);\n    this.tone(1760, 0.16, 'square', 0.08, 0.4);\n  },\n  lock() { this.tone(170, 0.4, 'sawtooth', 0.28); this.tone(85, 0.55, 'sine', 0.32); this.tone(1046, 0.3, 'square', 0.1, 0.08); },\n  goal() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.2, 'sawtooth', 0.16, i * 0.07)); this.tone(65, 0.45, 'sine', 0.3); },\n  undo() { this.tone(320, 0.1, 'triangle', 0.1); this.tone(210, 0.16, 'triangle', 0.1, 0.09); },\n  whistle() { this.tone(2300, 0.13, 'square', 0.1); this.tone(2300, 0.13, 'square', 0.1, 0.19); this.tone(2700, 0.55, 'square', 0.1, 0.38); },\n  fanfare() { [392, 523, 659, 784, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.28, 'sawtooth', 0.15, i * 0.16)); [392, 523, 659, 784, 659, 784, 1046].forEach((f, i) => this.tone(f / 2, 0.28, 'triangle', 0.12, i * 0.16)); }\n};\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const fresh = { tossDone: false, fixtures: [], champion: null, tourId: null, sound: true, awake: true, rosters: {}, removed: {}, prize: 5000, minMatches: 0, picks: [] };\n    const saved = store.get();\n    this.state = Object.assign(fresh, saved || {}, {\n      rolling: false, tossPending: false, lockShow: false, slotA: 0, slotB: 1,\n      rollA: false, rollB: false, spinD: 0, lockA: 0, lockB: 0,\n      menuOpen: false, modalTeam: null, toast: null, penaltyFor: null, resetArmed: false, restartConfirm: false, endConfirm: false,\n      editFixId: null, editEvents: null, editPenA: 0, editPenB: 0,\n      updateReady: false, clockTick: 0, tvOpen: false, bootOpen: false,\n      hall: hallStore.get(), hallOpen: false\n    });\n    this._timers = [];\n  }\n  save() {\n    const { tossDone, fixtures, champion, tourId, sound, awake, rosters, removed, prize, minMatches, picks } = this.state;\n    store.set({ tossDone, fixtures, champion, tourId, sound, awake, rosters, removed, prize, minMatches, picks, ts: Date.now() });\n  }\n  rounds() {\n    const n = this.active().length;\n    const single = Math.max(1, n - 1);\n    const mm = this.state.minMatches || 0;\n    return Math.max(1, Math.min(6, Math.ceil(mm / single)));\n  }\n  active() { return TEAMS.map((t, i) => i).filter(i => !(this.state.removed || {})[TEAMS[i].id]); }\n  playersOf(i) { return this.players(i).filter(p => p && p.trim()); }\n  toggleTeam(i) {\n    const id = TEAMS[i].id;\n    const removed = Object.assign({}, this.state.removed);\n    if (!removed[id] && this.state.tossDone) { this.toastMsg('RESET TOURNAMENT TO REMOVE TEAMS', '#ff6b6b'); return; }\n    if (!removed[id] && this.active().length <= 2) { this.toastMsg('AT LEAST 2 TEAMS NEEDED', '#ff6b6b'); return; }\n    if (removed[id]) delete removed[id]; else removed[id] = true;\n    SFX.click();\n    this.toastMsg(removed[id] ? TEAMS[i].short + ' REMOVED' : TEAMS[i].short + ' RESTORED', removed[id] ? '#ff6b6b' : '#c8ff2e');\n    this.setState({ removed }, () => this.save());\n  }\n  players(i) {\n    const r = this.state.rosters && this.state.rosters[TEAMS[i].id];\n    return (Array.isArray(r) && r.length === 2) ? r : TEAMS[i].players;\n  }\n  swapPlayers(a, b) {\n    if (a.t === b.t && a.s === b.s) { this.setState({ swapSel: null }); return; }\n    const pa = this.players(a.t).slice();\n    const pb = a.t === b.t ? pa : this.players(b.t).slice();\n    const tmp = pa[a.s]; pa[a.s] = pb[b.s]; pb[b.s] = tmp;\n    const rosters = Object.assign({}, this.state.rosters, { [TEAMS[a.t].id]: pa, [TEAMS[b.t].id]: pb });\n    SFX.click();\n    this.toastMsg('PLAYERS SWAPPED', '#c8ff2e');\n    this.setState({ rosters, swapSel: null }, () => this.save());\n  }\n  chipTap(t, s) {\n    const sel = this.state.swapSel;\n    if (!sel) { SFX.click(); this.setState({ swapSel: { t, s } }); return; }\n    if (sel.t === t && sel.s === s) { this.setState({ swapSel: null }); return; }\n    this.swapPlayers(sel, { t, s });\n  }\n  setPlayer(i, slot, val) {\n    const cur = this.players(i).slice();\n    const old = cur[slot];\n    cur[slot] = val;\n    const rosters = Object.assign({}, this.state.rosters, { [TEAMS[i].id]: cur });\n    const fixtures = this.state.fixtures;\n    fixtures.forEach(f => f.events.forEach(e => { if (e.team === i && e.player === old) e.player = val; }));\n    this.setState({ rosters, fixtures: fixtures.slice() }, () => this.save());\n  }\n  removePlayerSlot(i, slot) {\n    const name = this.players(i)[slot];\n    SFX.click();\n    this.setPlayer(i, slot, '');\n    this.toastMsg((name || 'PLAYER').toUpperCase() + ' REMOVED', '#ff6b6b');\n  }\n  addPlayerSlot(i, slot) {\n    SFX.click();\n    const id = 'rosterAdd_' + i + '_' + slot;\n    this.setState({ rosterAddSlot: { t: i, s: slot } }, () => {\n      const el = document.getElementById(id);\n      if (el) el.focus();\n    });\n  }\n  blurAddSlot(i, slot) {\n    this.setState(s => (s.rosterAddSlot && s.rosterAddSlot.t === i && s.rosterAddSlot.s === slot) ? { rosterAddSlot: null } : null);\n  }\n  later(fn, ms) { this._timers.push(setTimeout(fn, ms)); }\n  componentWillUnmount() {\n    this._timers.forEach(clearTimeout);\n    this.stopRoll();\n    if (this._clockTimer) clearInterval(this._clockTimer);\n    if (this._onVis) document.removeEventListener('visibilitychange', this._onVis);\n    if (this._wake) { const w = this._wake; this._wake = null; w.release().catch(() => {}); }\n  }\n  // ---------- toss ----------\n  randPair() {\n    const act = this.active();\n    const a = act[Math.floor(Math.random() * act.length)];\n    let b = act[Math.floor(Math.random() * act.length)];\n    while (b === a) b = act[Math.floor(Math.random() * act.length)];\n    return [a, b];\n  }\n  genFixtures(a, b) {\n    const act = this.active();\n    const pairs = [];\n    for (let x = 0; x < act.length; x++) for (let y = x + 1; y < act.length; y++) pairs.push([act[x], act[y]]);\n    const rounds = this.rounds();\n    const rest = [];\n    for (let r = 0; r < rounds; r++) pairs.forEach(p => rest.push(p.slice()));\n    const firstIdx = rest.findIndex(p => p.includes(a) && p.includes(b));\n    if (firstIdx >= 0) rest.splice(firstIdx, 1);\n    const order = [[a, b]];\n    while (rest.length) {\n      const prev = order[order.length - 1];\n      let idx = rest.findIndex(p => !p.includes(prev[0]) && !p.includes(prev[1]));\n      if (idx < 0) idx = 0;\n      order.push(rest.splice(idx, 1)[0]);\n    }\n    return order.map((p, i) => ({ id: 'L' + (i + 1), stage: 'LEAGUE', num: i + 1, a: p[0], b: p[1], events: [], done: false, pen: null, pickA: '', pickB: '' }));\n  }\n  // Changing the league length before a ball is kicked should redraw the board\n  // there and then. Once any match has started the draw is history, so the new\n  // number waits for a reset rather than pulling fixtures out from under the\n  // night. The opening pair — the one the toss picked — is kept.\n  // The clock stamps itself the moment a match becomes current, so a running\n  // clock is no proof anything has happened — a goal or a finished match is.\n  leagueStarted() {\n    const fx = this.state.fixtures || [];\n    return fx.some(f => f.done || (f.events && f.events.length));\n  }\n  reflowLeague() {\n    const st = this.state;\n    if (!st.tossDone || st.champion != null || !st.fixtures.length) return;\n    if (this.leagueStarted()) return;\n    const first = st.fixtures[0];\n    const fixtures = this.genFixtures(first.a, first.b);\n    if (fixtures.length === st.fixtures.length) return;\n    fixtures[0].pickA = first.pickA || '';\n    fixtures[0].pickB = first.pickB || '';\n    if (first.startedAt) fixtures[0].startedAt = first.startedAt;\n    this.setState({ fixtures }, () => this.save());\n    this.toastMsg(fixtures.length + ' LEAGUE MATCHES', '#c8ff2e');\n  }\n  startToss = () => {\n    if (this.state.tossDone || this.state.rolling || this.state.tossPending) return;\n    SFX.ac(); SFX.showdown();\n    const act = this.active();\n    if (act.length === 2) {\n      const fixtures = this.genFixtures(act[0], act[1]);\n      this.setState({ tossDone: true, rolling: false, lockShow: true, slotA: act[0], slotB: act[1], fixtures }, () => this.save());\n      SFX.lock();\n      this.toastMsg('MATCH 1 LOCKED', '#c8ff2e');\n      this.later(() => this.setState({ lockShow: false }), 2400);\n      return;\n    }\n    this.runRoulette();\n  };\n  // The draw is the one moment the whole room is watching, so it is built like\n  // a wheel rather than a list of jumps: flat out until the crests are a blur,\n  // then an exponential slow-down, and the two sides land one after the other\n  // so there is a second reveal to shout at instead of one.\n  stopRoll() {\n    (this._rollTimers || []).forEach(clearTimeout);\n    this._rollTimers = [];\n    this.shakePage(0);\n    SFX.buzz(0);\n  }\n  randOther(not) {\n    const act = this.active().filter(i => i !== not);\n    return act[Math.floor(Math.random() * act.length)];\n  }\n  rollSteps() {\n    const FLAT = 3200, MAXD = 480, GROW = 1.055;\n    const steps = [];\n    let t = 0, d = 45;\n    while (t < FLAT) { steps.push({ t, d }); t += d; }\n    while (d < MAXD) { steps.push({ t, d }); t += d; d = Math.min(MAXD, d * GROW); }\n    steps.push({ t, d: MAXD });\n    return { steps, end: t + MAXD };\n  }\n  // The shake belongs to the whole page, not one card, so the room sees the\n  // board itself rattle. Written only when the level changes — rewriting it\n  // every step would restart the keyframes and kill the motion.\n  shakePage(level) {\n    if (this._shake === level) return;\n    this._shake = level;\n    if (typeof document === 'undefined' || !document.body) return;\n    document.body.style.animation = level === 2 ? 'appshake .15s linear infinite'\n      : level === 1 ? 'appshakesoft .22s linear infinite' : '';\n  }\n  runRoulette() {\n    this.stopRoll();\n    const at = (ms, fn) => { this._rollTimers.push(setTimeout(fn, ms)); };\n    this.setState({ rolling: true, tossPending: false, rollA: true, rollB: true, spinD: 45, lockA: 0 });\n    SFX.sweep([110, 700], 3.2, 'sawtooth', 0.085);\n    SFX.sweep([55, 190], 3.4, 'sine', 0.13);\n    this.shakePage(2);\n    SFX.buzz(160);\n    const { steps, end } = this.rollSteps();\n    // one side settles once the wheel is visibly slowing, not on a fixed count\n    let aIdx = steps.findIndex(s => s.d >= 300);\n    if (aIdx < 0) aIdx = steps.length - 1;\n    steps.forEach((s, i) => {\n      const prog = i / steps.length;\n      at(s.t, () => {\n        if (i >= aIdx) {\n          this.setState({ slotB: this.randOther(this.state.slotA), spinD: s.d, rollA: false });\n        } else {\n          const [a, b] = this.randPair();\n          this.setState({ slotA: a, slotB: b, spinD: s.d });\n        }\n        this.shakePage(s.d <= 70 ? 2 : s.d <= 240 ? 1 : 0);\n        if (i === aIdx) { SFX.lock(); SFX.buzz([50, 40, 90]); this.setState({ lockA: Date.now() }); }\n        // at full speed a tick every step is a buzz, so thin them out early\n        if (s.d >= 80 || i % 3 === 0) {\n          SFX.tone(820 + prog * 900, 0.04, 'square', 0.045 + prog * 0.045);\n          SFX.buzz(Math.round(Math.min(26, 9 + s.d / 24)));\n        }\n      });\n    });\n    at(end, () => {\n      SFX.lock();\n      SFX.tone(1760, 0.22, 'square', 0.1, 0.06);\n      SFX.buzz([70, 50, 140]);\n      this.shakePage(0);\n      this.setState({ rolling: false, tossPending: true, rollA: false, rollB: false, spinD: 0, lockB: Date.now() });\n    });\n  }\n  rerollToss = () => {\n    if (this.state.tossDone || this.state.rolling) return;\n    SFX.ac(); SFX.click();\n    this.runRoulette();\n  };\n  cancelRoll() { this.stopRoll(); }\n  acceptToss = () => {\n    if (this.state.tossDone || !this.state.tossPending) return;\n    const a = this.state.slotA, b = this.state.slotB;\n    const fixtures = this.genFixtures(a, b);\n    this.setState({ tossDone: true, rolling: false, tossPending: false, lockShow: true, fixtures }, () => this.save());\n    SFX.lock();\n    this.toastMsg('MATCH 1 LOCKED', '#c8ff2e');\n    this.later(() => this.setState({ lockShow: false }), 3000);\n  };\n  // ---------- match ops ----------\n  curFix() { return this.state.fixtures.find(f => !f.done) || null; }\n  nextFix() { const pend = this.state.fixtures.filter(f => !f.done); return pend.length > 1 ? pend[1] : null; }\n  score(f) {\n    let a = 0, b = 0;\n    f.events.forEach(e => { if (e.team === f.a) a++; else if (e.team === f.b) b++; });\n    return { a, b };\n  }\n  winner(f) { const s = this.score(f); return s.a > s.b ? f.a : s.b > s.a ? f.b : f.pen; }\n  // ---------- match clock ----------\n  // The clock anchors itself the moment a match becomes the current one. The\n  // operator is beside the console with a controller in hand, so a separate\n  // kick-off tap was only ever a step to forget. The anchor is written once and\n  // saved, so a reload keeps the same start time.\n  ensureClock() {\n    if (!this.state.tossDone) return;\n    const f = this.curFix();\n    if (!f || f.startedAt) return;\n    f.startedAt = Date.now();\n    this.setState({ fixtures: this.state.fixtures.slice(), clockTick: Date.now() }, () => this.save());\n  }\n  mmss(ms) {\n    const s = Math.max(0, Math.floor(ms / 1000));\n    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');\n  }\n  clockLabel(f) { return f && f.startedAt ? this.mmss(Date.now() - f.startedAt) : ''; }\n  // Goals recorded before kick-off get no stamp rather than a nonsense one.\n  goalTime(f, e) { return f.startedAt && e.ts >= f.startedAt ? this.mmss(e.ts - f.startedAt) : ''; }\n  // ---------- goals ----------\n  // An own goal counts for the other side but must never land in the scorer's\n  // tally, so the credited team is stored on the event and the player is only\n  // kept for the record.\n  recordGoal(player, playerTeam) {\n    const f = this.curFix(); if (!f) return;\n    f.events.push({ player, team: playerTeam, ts: Date.now() });\n    SFX.goal();\n    this.toastMsg('GOAL — ' + player.toUpperCase(), TEAMS[playerTeam].color);\n    this.setState({ fixtures: this.state.fixtures.slice() }, () => this.save());\n  }\n  // ---------- big screen ----------\n  // The room reads the score off a propped-up tablet while the operator keeps\n  // scoring on the same device, so the goal buttons stay on this view instead\n  // of forcing a trip back out for every goal.\n  openTV = () => {\n    SFX.click();\n    this.setState({ tvOpen: true, menuOpen: false });\n    const el = document.documentElement;\n    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});\n  };\n  closeTV = () => {\n    SFX.click();\n    this.setState({ tvOpen: false });\n    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});\n  };\n  // ---------- golden boot poster ----------\n  // The poster is a printed-looking plate the room gets shown at the end of the\n  // night, so it takes the whole screen the same way the big screen does.\n  openBoot = () => {\n    SFX.click();\n    this.setState({ bootOpen: true, menuOpen: false });\n    const el = document.documentElement;\n    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});\n  };\n  closeBoot = () => {\n    SFX.click();\n    this.setState({ bootOpen: false });\n    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});\n  };\n  // The boot goes to the leading scorer, and only once a goal has been scored;\n  // ties settle by name so the poster and the awards strip never disagree.\n  bootWinner() {\n    const goals = this.playerGoals();\n    const top = this.active().flatMap(i => this.playersOf(i).map(p => ({ name: p, goals: goals[p] || 0 })))\n      .sort((a, b) => b.goals - a.goals || a.name.localeCompare(b.name))[0];\n    return top && top.goals > 0 ? top : null;\n  }\n  // The poster on screen is the art with two lines laid over it, so saving it\n  // means painting those same two lines into a canvas at the art's own size —\n  // the fractions below are the ones the overlay is positioned with. iOS has no\n  // usable file download, so the share sheet (Save Image, or straight into\n  // WhatsApp) is tried first and a plain download is the fallback.\n  savePoster = async () => {\n    if (this._saving) return;\n    const win = this.bootWinner();\n    if (!win) return;\n    this._saving = true;\n    SFX.click();\n    try {\n      const img = new Image();\n      img.src = 'posters/golden-boot.jpg';\n      await img.decode();\n      if (document.fonts && document.fonts.load) {\n        try { await document.fonts.load('900 100px Orbitron'); await document.fonts.ready; } catch (e) {}\n      }\n      const W = img.naturalWidth, H = img.naturalHeight;\n      const cv = document.createElement('canvas');\n      cv.width = W; cv.height = H;\n      const g = cv.getContext('2d');\n      g.drawImage(img, 0, 0, W, H);\n\n      const name = win.name.trim().toUpperCase();\n      const words = name.split(/\\s+/);\n      const fs = Math.min(0.085, 0.085 * 9 / win.name.trim().length) * W;\n      g.font = '900 ' + fs + 'px Orbitron, sans-serif';\n      g.textAlign = 'left';\n      g.textBaseline = 'middle';\n      const gap = fs * 0.3;\n      const parts = words.length > 1\n        ? [{ t: words[0], c: '#dfe6ee' }, { t: words.slice(1).join(' '), c: '#c8ff2e' }]\n        : [{ t: name, c: '#c8ff2e' }];\n      const total = parts.reduce((a, q) => a + g.measureText(q.t).width, 0) + gap * (parts.length - 1);\n      g.save();\n      // The nameplate art leans; the lettering leans with it.\n      g.translate(W * 0.5145, H * 0.831);\n      g.transform(1, 0, Math.tan(-6 * Math.PI / 180), 1, 0, 0);\n      let x = -total / 2;\n      parts.forEach(q => {\n        g.fillStyle = 'rgba(0,0,0,.55)';\n        g.fillText(q.t, x, fs * 0.035);\n        g.save();\n        g.shadowColor = q.c === '#c8ff2e' ? 'rgba(200,255,46,.45)' : 'rgba(255,255,255,.22)';\n        g.shadowBlur = fs * 0.24;\n        g.fillStyle = q.c;\n        g.fillText(q.t, x, 0);\n        g.restore();\n        x += g.measureText(q.t).width + gap;\n      });\n      g.restore();\n\n      const nfs = W * 0.027;\n      g.font = '900 ' + nfs + 'px Orbitron, sans-serif';\n      g.textAlign = 'center';\n      g.fillStyle = '#c8ff2e';\n      g.save();\n      g.shadowColor = 'rgba(200,255,46,.4)';\n      g.shadowBlur = nfs * 0.5;\n      g.fillText(String(win.goals), W * 0.599, H * 0.909);\n      g.restore();\n\n      const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.92));\n      if (!blob) throw new Error('no blob');\n      const fname = 'golden-boot-' + win.name.trim().toLowerCase().replace(/\\s+/g, '-') + '.jpg';\n      const file = new File([blob], fname, { type: 'image/jpeg' });\n      if (navigator.canShare && navigator.canShare({ files: [file] })) {\n        try { await navigator.share({ files: [file] }); this._saving = false; return; }\n        catch (e) { this._saving = false; if (e && e.name === 'AbortError') return; }\n      }\n      const url = URL.createObjectURL(blob);\n      const a = document.createElement('a');\n      a.href = url; a.download = fname;\n      document.body.appendChild(a); a.click(); a.remove();\n      this.later(() => URL.revokeObjectURL(url), 5000);\n      this.toastMsg('POSTER SAVED', '#ffd54a');\n    } catch (e) {\n      this.toastMsg('COULD NOT SAVE THE POSTER', '#ff6b6b');\n    }\n    this._saving = false;\n  };\n  promote(fid) {\n    const fx = this.state.fixtures;\n    const i = fx.findIndex(f => f.id === fid);\n    if (i < 0 || fx[i].done) return;\n    const cur = this.curFix();\n    if (cur && cur.events.length > 0) return;\n    const curIdx = cur ? fx.indexOf(cur) : fx.length;\n    const target = curIdx;\n    if (i === target) return;\n    const [f] = fx.splice(i, 1);\n    fx.splice(target > i ? target : target, 0, f);\n    fx.forEach((x, idx) => { x.num = idx + 1; });\n    SFX.click();\n    this.toastMsg('NOW THE CURRENT MATCH', '#c8ff2e');\n    this.setState({ fixtures: fx.slice() }, () => this.save());\n  }\n  setPick(side, val) {\n    const f = this.curFix(); if (!f) return;\n    if (side === 'A') f.pickA = val; else f.pickB = val;\n    this.setState({ fixtures: this.state.fixtures.slice() }, () => this.save());\n  }\n  pickFocus(side) {\n    clearTimeout(this._pickBlurT);\n    this.setState({ pickFocus: side });\n  }\n  pickBlur(side) {\n    clearTimeout(this._pickBlurT);\n    this._pickBlurT = setTimeout(() => {\n      this.setState(s => s.pickFocus === side ? { pickFocus: null } : null);\n    }, 180);\n  }\n  pickChoose(side, val) {\n    clearTimeout(this._pickBlurT);\n    this.setPick(side, val);\n    this.setState({ pickFocus: null });\n  }\n  pickSuggestions(side, typed) {\n    const q = (typed || '').trim().toUpperCase();\n    const learned = this.state.picks || [];\n    const all = learned.concat(DEFAULT_PICKS.filter(p => !learned.includes(p)));\n    const list = q ? all.filter(p => p.includes(q) && p !== q) : all;\n    return list.slice(0, 9);\n  }\n  undoGoal = () => {\n    const f = this.curFix(); if (!f || !f.events.length) return;\n    const e = f.events.pop();\n    SFX.undo();\n    this.toastMsg((e.og ? 'OWN GOAL REMOVED — ' : 'GOAL REMOVED — ') + e.player.toUpperCase(), '#9fb0c0');\n    this.setState({ fixtures: this.state.fixtures.slice() }, () => this.save());\n  };\n  askRestartMatch = () => {\n    const f = this.curFix(); if (!f) return;\n    SFX.click();\n    this.setState({ restartConfirm: true });\n  };\n  cancelRestartMatch = () => { SFX.click(); this.setState({ restartConfirm: false }); };\n  confirmRestartMatch = () => {\n    const f = this.curFix();\n    if (!f) { this.setState({ restartConfirm: false }); return; }\n    f.events = [];\n    f.pickA = ''; f.pickB = '';\n    delete f.startedAt;\n    SFX.undo();\n    this.toastMsg('MATCH RESTARTED', '#ff7b7b');\n    this.setState({ fixtures: this.state.fixtures.slice(), restartConfirm: false, penaltyFor: null }, () => this.save());\n  };\n  // ---------- fixing a finished result ----------\n  // The correction happens inside its own dialog on a working copy of the\n  // goals: the live board keeps the match it is on, and nothing downstream\n  // moves until the fix is saved. Everything after a result is derived from\n  // it, so a changed score still sends the knockouts it seeded back in the hat.\n  dropForEdit(f, fx) {\n    if (f.stage === 'LEAGUE') return fx.filter(x => x.stage !== 'LEAGUE');\n    if (f.stage === 'SEMI-FINAL') return fx.filter(x => x.stage === 'FINAL');\n    return [];\n  }\n  editFix() { return this.state.editFixId ? this.state.fixtures.find(x => x.id === this.state.editFixId) : null; }\n  editScore() {\n    const f = this.editFix();\n    if (!f) return { a: 0, b: 0 };\n    let a = 0, b = 0;\n    (this.state.editEvents || []).forEach(e => { if (e.team === f.a) a++; else if (e.team === f.b) b++; });\n    return { a, b };\n  }\n  askEditFix = (fid) => {\n    const f = this.state.fixtures.find(x => x.id === fid);\n    if (!f) return;\n    SFX.click();\n    this.setState({\n      editFixId: fid,\n      editEvents: f.events.map(e => Object.assign({}, e)),\n      editPenA: f.penA != null ? f.penA : 0,\n      editPenB: f.penB != null ? f.penB : 0\n    });\n  };\n  cancelEditFix = () => { SFX.click(); this.setState({ editFixId: null, editEvents: null }); };\n  editAddGoal(player, playerTeam) {\n    if (!this.editFix()) return;\n    SFX.goal();\n    this.setState({ editEvents: (this.state.editEvents || []).concat([{ player, team: playerTeam, ts: Date.now() }]) });\n  }\n  editDropGoal(i) {\n    const ev = (this.state.editEvents || []).slice();\n    if (i < 0 || i >= ev.length) return;\n    ev.splice(i, 1);\n    SFX.undo();\n    this.setState({ editEvents: ev });\n  }\n  setEditPen(side, v) {\n    const n = Math.max(0, Math.min(99, parseInt(v, 10) || 0));\n    this.setState(side === 'A' ? { editPenA: n } : { editPenB: n });\n  }\n  confirmEditFix = () => {\n    const target = this.editFix();\n    if (!target) { this.setState({ editFixId: null, editEvents: null }); return; }\n    const fx = this.state.fixtures.map(x => (x.id === target.id ? Object.assign({}, x) : x));\n    const f = fx.find(x => x.id === target.id);\n    const before = this.score(target);\n    // One fix per match: saving spends it, whatever the new score turns out to\n    // be. A result that needs correcting twice is a result nobody trusts.\n    f.fixed = true;\n    f.events = (this.state.editEvents || []).slice();\n    const s = this.score(f);\n    let penChanged = false;\n    if (f.stage !== 'LEAGUE') {\n      if (s.a === s.b) {\n        const pa = Number(this.state.editPenA) || 0, pb = Number(this.state.editPenB) || 0;\n        if (pa === pb) { this.toastMsg('A SHOOTOUT CANNOT END LEVEL', '#ff6b6b'); return; }\n        penChanged = f.penA !== pa || f.penB !== pb;\n        f.penA = pa; f.penB = pb; f.pen = pa > pb ? f.a : f.b;\n      } else if (f.penA != null) {\n        penChanged = true;\n        f.penA = null; f.penB = null; f.pen = null;\n      }\n    }
